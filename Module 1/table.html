<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex Example</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

.container {
  display: flex;
  width: 900px;
  height: 150px;
  margin: 50px auto;
  border: 3px solid black;
}

.item {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 2rem;
  color: white;
}

/* Item 1 */
.one {
  background: tomato;
  flex: 1 1 200px;
}

/* Item 2 */
.two {
  background: royalblue;
  flex: 2 1 200px;
}

/* Item 3 */
.three {
  background: seagreen;
  flex: 1 1 200px;
}
</style>
<div class="container">
  <div class="item one">1</div>
  <div class="item two">2</div>
  <div class="item three">3</div>
</div>

</body>
</html>
